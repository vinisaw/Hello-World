on: [push]

jobs:
  hello_world_job:
    runs-on: ubuntu-latest
    name: A job to say hello
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Use custom action
        uses: ./
        with:
          who-to-greet: 'Mona the Octocat'
      
      - name: Show completion message
        run: echo "Action completed successfully!"
        shell: bash
